name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Network
  http: ^1.2.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  
  # Image
  image_picker: ^1.1.2
  
  # Biometrics
  local_auth: ^2.2.0
  
  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Localization
  intl: ^0.20.0
  flutter_local_notifications: ^22.2.0
  crop_your_image: ^2.0.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/kvsk_cctv_it_solutions.jpg
