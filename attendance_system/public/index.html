<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll and Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="splashWrapper">
      <div class="splash-modal" id="splashScreen">
        <div class="splash-modal-bar">
          <div class="splash-modal-fill" id="splashBar"></div>
        </div>
      </div>
    </div>
    <style>
      #splashWrapper {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg, #f4f5f8);
        transition: opacity 0.25s ease, visibility 0.25s ease;
        pointer-events: none;
      }
      body.dark-mode #splashWrapper { background: #111318; }
      #splashWrapper.fade-out { opacity: 0; visibility: hidden; }
      .splash-modal {
        width: 160px; padding: 16px 20px;
        background: var(--panel, #fff);
        border: 1px solid var(--line, #e4e7ed);
        border-radius: 10px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        pointer-events: auto;
      }
      body.dark-mode .splash-modal {
        background: #1a1e26;
        box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      }
      .splash-modal-bar {
        width: 100%; height: 4px;
        background: var(--line, #e4e7ed);
        border-radius: 999px; overflow: hidden;
      }
      .splash-modal-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #c62828, #ef5350);
        border-radius: 999px;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <main id="app"></main>
    <script src="/utils.js"></script>
    <script src="/state.js"></script>
    <script src="/api.js"></script>
    <script src="/components/searchable-select.js"></script>
    <script src="/modals.js"></script>
    <script src="/views.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
